spring.application.name=ms-usuarios
server.port=8081

# Conexión MySQL (XAMPP por defecto: usuario root, sin clave)
# createDatabaseIfNotExist=true crea la BD automáticamente si no existe en phpMyAdmin
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA (crea y actualiza la tabla 'usuarios' automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración explícita de Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true